<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="./annotation.css">
  <style>
    #owner-account-bar { position: fixed; z-index: 2147483646; top: 10px; right: 14px; width: auto; min-height: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-end; gap: 7px; padding: 0; background: transparent; color: #263238; font: 12px/1.3 system-ui, sans-serif; pointer-events: none; }
    #owner-account-bar[hidden] { display: none; }
    #owner-account-bar button { pointer-events: auto; border: 0; border-radius: 5px; padding: 6px 9px; background: #263238; color: #fff; cursor: pointer; font: inherit; }
    #owner-account-email { display: inline-block; max-width: min(32vw, 220px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 5px 8px; border-radius: 999px; background: rgb(255 255 255 / .94); box-shadow: 0 1px 5px rgb(0 0 0 / .18); }
    #owner-auth-panel { position: fixed !important; z-index: 2147483647 !important; inset: 0; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / .55); pointer-events: auto !important; }
    #owner-auth-panel[hidden] { display: none; }
    #owner-auth-card { position: relative; z-index: 1; pointer-events: auto !important; box-sizing: border-box; width: min(100%, 420px); padding: 24px; border-radius: 12px; background: white; color: #222; box-shadow: 0 12px 40px rgb(0 0 0 / .25); font: 16px/1.45 system-ui, sans-serif; }
    #owner-auth-card form { display: grid; gap: 10px; }
    #owner-auth-card input { position: relative; z-index: 2; pointer-events: auto !important; box-sizing: border-box; width: 100%; padding: 10px; }
    #owner-auth-card button { padding: 9px 14px; cursor: pointer; }
    #owner-auth-modes { display: flex; gap: 8px; margin: 12px 0; }
    #owner-auth-modes button[aria-pressed="true"] { font-weight: 700; outline: 2px solid #42b983; }
    #owner-auth-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    #owner-auth-status { min-height: 1.4em; overflow-wrap: anywhere; }
    body.owner-auth-pending #app, body.owner-auth-pending #annotation-sidebar, body.owner-auth-pending #annotation-dialog { visibility: hidden; }
    @media (max-width: 600px) { #owner-account-bar { top: 8px; right: 8px; gap: 5px; } #owner-account-email { max-width: 30vw; font-size: 11px; } #owner-account-bar button { padding: 6px 7px; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <aside id="annotation-sidebar" aria-label="Text annotations">
    <div class="annotation-header"><h3>Comments</h3><p>Select text in the article to leave a comment.</p></div>
    <div id="annotation-list"></div>
  </aside>
  <dialog id="annotation-dialog">
    <form id="annotation-form">
      <h3>Add a comment</h3>
      <blockquote id="annotation-selected-text"></blockquote>
      <label for="annotation-nickname">Name</label>
      <select id="annotation-nickname" required><option value="Lkh">Lkh</option><option value="FernandoZ">FernandoZ</option></select>
      <label for="annotation-body">Comment</label>
      <textarea id="annotation-body" name="body" maxlength="5000" rows="5" required></textarea>
      <label for="annotation-image">Attach a photo (optional, max 5 MB)</label>
      <input id="annotation-image" name="image" type="file" accept="image/*">
      <p id="annotation-status" aria-live="polite"></p>
      <div class="annotation-actions"><button type="button" id="annotation-cancel">Cancel</button><button type="submit" id="annotation-submit">Submit</button></div>
    </form>
  </dialog>

  <header id="owner-account-bar" aria-live="polite">
    <span id="owner-account-email">Not signed in</span>
    <button id="owner-auth-open" type="button">Login / Register</button>
    <button id="owner-auth-logout" type="button" hidden>Log out</button>
  </header>
  <section id="owner-auth-panel" hidden aria-modal="true" role="dialog" aria-labelledby="owner-auth-title">
    <div id="owner-auth-card">
      <h2 id="owner-auth-title">Login</h2>
      <p id="owner-auth-help">Sign in with your email and password.</p>
      <div id="owner-auth-modes" role="group" aria-label="Choose login or registration">
        <button type="button" data-auth-mode="login" aria-pressed="true">Login</button>
        <button type="button" data-auth-mode="register" aria-pressed="false">Register</button>
      </div>
      <form id="owner-auth-form">
        <label for="owner-auth-email">Email</label>
        <input id="owner-auth-email" type="email" autocomplete="username" required>
        <label id="owner-auth-password-label" for="owner-auth-password">Password</label>
        <input id="owner-auth-password" type="password" autocomplete="current-password" minlength="8" required>
        <label id="owner-auth-confirm-label" for="owner-auth-confirm" hidden>Confirm password</label>
        <input id="owner-auth-confirm" type="password" autocomplete="new-password" minlength="8" hidden>
        <p id="owner-auth-status" aria-live="polite"></p>
        <div id="owner-auth-actions"><button id="owner-auth-cancel" type="button">Close</button><button id="owner-auth-submit" type="submit">Login</button></div>
      </form>
    </div>
  </section>

  <script>
    window.$docsify = { name: '', repo: '', plugins: [function (hook) {
      hook.doneEach(function () { if (window.annotationSystem) window.annotationSystem.refresh(); });
    }] };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./owner-auth.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="./annotation.js"></script>
</body>
</html>
